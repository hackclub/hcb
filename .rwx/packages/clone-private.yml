# Clones a private repository (hcb-private) with the RWX GitHub App token.
package:
  parameters:
    repository:
      description: HTTPS clone URL
      required: true
    ref:
      description: Commit SHA or ref to check out
      required: true
    preserve-git-dir:
      description: Keep the .git directory after cloning
      default: false
    path:
      description: Directory within the workspace to clone into
      default: ./

tasks:
  - key: clone
    call: git/clone 2.4.1
    with:
      repository: ${{ params.repository }}
      ref: ${{ params.ref }}
      github-token: ${{ github.token }}
      preserve-git-dir: ${{ params.preserve-git-dir }}
      path: ${{ params.path }}
