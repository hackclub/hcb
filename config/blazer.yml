# see https://github.com/ankane/blazer for more info

data_sources:
  main:
    url: <%= ENV["BLAZER_DATABASE_URL"].presence || ENV["DATABASE_URL"] %>

    # statement timeout, in seconds
    # none by default
    timeout: 30

    # caching settings
    # can greatly improve speed
    # off by default
    # cache:
    #   mode: slow # or all
    #   expires_in: 60 # min
    #   slow_threshold: 15 # sec, only used in slow mode

    # wrap queries in a transaction for safety
    # not necessary if you use a read-only user
    # true by default
    # use_transaction: false

    smart_variables:
      # zone_id: "SELECT id, name FROM zones ORDER BY name ASC"
      # period: ["day", "week", "month"]
      # status: {0: "Active", 1: "Archived"}
      user_id: "SELECT id, CONCAT(full_name, ' (', email, ')') FROM users ORDER BY full_name ASC"
      event_id: "SELECT id, name FROM events ORDER BY name ASC"
      month: { 1: "January", 2: "February", 3: "March", 4: "April", 5: "May", 6: "June", 7: "July", 8: "August", 9: "September", 10: "October", 11: "November", 12: "December" }
      bank_account_id: |
        SELECT CONCAT('plaid_', plaid_account_id) AS id, CONCAT('Plaid: ', name) FROM bank_accounts WHERE should_sync_v2
        UNION
        SELECT
          DISTINCT CONCAT('increase_', increase_account_id) AS id,
          CASE increase_account_id
            WHEN 'account_phqksuhybmwhepzeyjcb' THEN 'Increase: FS Main'
            WHEN 'account_v9tdabo2us8epcz8onuq' THEN 'Increase: DAF Main'
            ELSE CONCAT('Increase: ', increase_account_id)
          END AS name
        FROM events
        UNION
        SELECT 'stripe' AS id, 'Stripe Issuing' AS name


    linked_columns:
      # Events
      event_id: "/{value}"
      source_event_id: "/{value}"
      parent_event_id: "/{value}"
      managing_event_id: "/{value}"

      # Users
      user_id: "/users/{value}/admin"
      creator_id: "/users/{value}/admin"
      created_by_id: "/users/{value}/admin"
      requested_by_id: "/users/{value}/admin"
      fulfilled_by_id: "/users/{value}/admin"
      approved_by_id: "/users/{value}/admin"
      archived_by_id: "/users/{value}/admin"
      author_id: "/users/{value}/admin"
      authorized_by_id: "/users/{value}/admin"
      closed_by_id: "/users/{value}/admin"
      collected_by_id: "/users/{value}/admin"
      deactivator_id: "/users/{value}/admin"
      impersonated_by_id: "/users/{value}/admin"
      impersonator_id: "/users/{value}/admin"
      invited_by_id: "/users/{value}/admin"
      last_frozen_by_id: "/users/{value}/admin"
      manager_id: "/users/{value}/admin"
      manually_marked_as_paid_user_id: "/users/{value}/admin"
      mapped_by_id: "/users/{value}/admin"
      point_of_contact_id: "/users/{value}/admin"
      reactor_id: "/users/{value}/admin"
      reporter_id: "/users/{value}/admin"
      requester_id: "/users/{value}/admin"
      resource_owner_id: "/users/{value}/admin"
      reviewed_by_id: "/users/{value}/admin"
      reviewer_id: "/users/{value}/admin"
      sender_id: "/users/{value}/admin"
      sent_by_id: "/users/{value}/admin"
      submitted_by_id: "/users/{value}/admin"
      updated_by_id: "/users/{value}/admin"
      uploaded_by_id: "/users/{value}/admin"
      voided_by_id: "/users/{value}/admin"

      # Transactions
      hcb_code: "/hcb/{value}"
      hcb_code_id: "/hcb/{value}"
      canonical_transaction_id: "/canonical_transactions/{value}"
      canonical_pending_transaction_id: "/canonical_pending_transactions/{value}"

      # Transfers
      ach_transfer_id: "/ach_transfers/{value}"
      check_id: "/checks/{value}"
      increase_check_id: "/admin/{value}/increase_check_process"
      check_deposit_id: "/admin/check_deposits/{value}"
      disbursement_id: "/disbursements/{value}"
      wire_id: "/wires/{value}"
      wise_transfer_id: "/wise_transfers/{value}"
      paypal_transfer_id: "/admin/{value}/paypal_transfer_process"
      payment_id: "/payments/{value}"
      reimbursement_report_id: "/reimbursement/reports/{value}"

      # Cards
      stripe_card_id: "/stripe_cards/{value}"
      emburse_card_id: "/emburse_cards/{value}"

      # Incoming money
      donation_id: "/donations/{value}"
      invoice_id: "/invoices/{value}"
      sponsor_id: "/sponsors/{value}"

      # Organizations
      organizer_position_invite_id: "/invites/{value}"
      announcement_id: "/announcements/{value}"
      document_id: "/documents/{value}"
      g_suite_id: "/g_suites/{value}"
      employee_id: "/employees/{value}"
      admin_ledger_audit_id: "/admin/ledger_audits/{value}"

      # Blazer
      query_id: "/blazer/queries/{value}"
      dashboard_id: "/blazer/dashboards/{value}"

      # Stripe
      stripe_payment_intent_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/payments/{value}"
      stripe_charge_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/payments/{value}"
      stripe_customer_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/customers/{value}"
      stripe_invoice_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/invoices/{value}"
      stripe_subscription_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/subscriptions/{value}"
      stripe_payout_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/payouts/{value}"
      stripe_authorization_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/issuing/authorizations/{value}"
      
      # These hold different kinds of object depending on the table
      stripe_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/search?query={value}"
      stripe_transaction_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/search?query={value}"
      stripe_balance_transaction_id: "https://dashboard.stripe.com/acct_1CWoeyFSaumjmb9r/search?query={value}"

      ip_address: "https://www.iplocation.net/ip-lookup?query={value}"
      ip: "https://www.iplocation.net/ip-lookup?query={value}"

    smart_columns:
      user_id: "SELECT id, CONCAT(full_name, ' (', email, ')') FROM users WHERE id IN {value}"
      creator_id: "SELECT id, CONCAT(full_name, ' (', email, ')') FROM users WHERE id IN {value}"
      requested_by_id: "SELECT id, CONCAT(full_name, ' (', email, ')') FROM users WHERE id IN {value}"
      fulfilled_by_id: "SELECT id, CONCAT(full_name, ' (', email, ')') FROM users WHERE id IN {value}"
      event_id: "SELECT id, name FROM events WHERE id IN {value}"
      canonical_transaction_id: "SELECT id, CONCAT('Amount Cents: ', amount_cents, '. Memo: ', memo) FROM canonical_transactions WHERE id IN {value}"
      canonical_pending_transaction_id: "SELECT id, CONCAT('Amount Cents: ', amount_cents, '. Memo: ', memo) FROM canonical_pending_transactions WHERE id IN {value}"

# create audits
audit: true

# change the time zone
# time_zone: "Pacific Time (US & Canada)"

# class name of the user model
# user_class: User

# method name for the current user
user_method: blazer_current_user

# method name for the display name
# user_name: name

# custom before_action to use for auth
# before_action_method: require_admin

# email to send checks from
from_email: hcb@hackclub.com

# webhook for Slack
# slack_webhook_url: <%= ENV["BLAZER_SLACK_WEBHOOK_URL"] %>

check_schedules:
  - "1 day"
  - "1 hour"
  - "5 minutes"

# enable anomaly detection
# note: with trend, time series are sent to https://trendapi.org
# anomaly_checks: trend / r

# enable forecasting
# note: with trend, time series are sent to https://trendapi.org
# forecasting: trend / prophet

# enable map
mapbox_access_token: <%= Credentials.fetch(:MAPBOX) %>
